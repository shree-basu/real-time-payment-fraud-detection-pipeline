[build-system]
requires = ["setuptools>=80.9,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-fraud-streaming-reference"
version = "2.0.0"
description = "Production-realistic Pub/Sub, Beam/Dataflow, and BigQuery streaming reference"
requires-python = ">=3.11,<3.14"
dependencies = [
  "apache-beam[gcp]==2.75.0",
  "google-cloud-pubsub==2.31.1",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
