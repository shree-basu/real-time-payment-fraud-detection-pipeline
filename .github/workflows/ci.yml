name: Cloud-free CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-streaming-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate dependencies
        run: |
          python -m pip check
          python -m pip install --dry-run -r requirements-lock.txt

      - name: Lint and format check
        run: |
          python -m ruff check pipeline simulator tests
          python -m ruff format --check pipeline simulator tests

      - name: Run full suite including cloud graph
        if: runner.os == 'Linux'
        run: python -m pytest -q

      - name: Run Windows contract, DirectRunner, and TestStream suite
        if: runner.os == 'Windows'
        run: python -m pytest -q -m "not cloud_graph"

      - name: Compile Python
        run: python -m compileall -q pipeline simulator tests

      - name: Reject obvious committed credentials
        shell: bash
        run: |
          credential_pattern='AI''za[0-9A-Za-z_-]{35}|-----BEGIN ''(RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_''key_id"[[:space:]]*:'
          if git grep -nE "$credential_pattern"; then
            echo "Credential-like content found"
            exit 1
          fi

      - name: Enforce cloud-free workflows
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = [
              re.compile("google-github-actions/" + "auth"),
              re.compile("terraform" + r"\s+apply"),
              re.compile("gcloud" + r"\s+dataflow"),
              re.compile("gcloud" + r"\s+pubsub"),
              re.compile(r"--runner[= ]DataflowRunner"),
          ]
          hits = []
          for path in Path(".github/workflows").glob("*.y*ml"):
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in patterns):
                  hits.append(str(path))
          if hits:
              raise SystemExit(f"Deployment/GCP-auth command found in: {hits}")
          PY

  terraform-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -recursive -check

      - name: Backend-disabled initialization
        run: terraform init -backend=false -input=false

      - name: Static validation
        run: terraform validate

      - name: Prove default plan manages zero resources
        run: |
          terraform plan -input=false -refresh=false -lock=false -out=zero.tfplan
          terraform show -json zero.tfplan | jq -e '.resource_changes | length == 0'
